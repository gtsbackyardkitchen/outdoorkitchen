<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="images/favicon.png"><meta name="theme-color" content="#00428c"><title>Shop - GTS Backyard Kitchen</title>
<style>
:root{--g:#00428c;--gd:#00336d;--c:#2b2d2f;--m:#6b7075;--l:#f2f6fc;--b:#dfe6f1;--r:12px}
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--c);background:#fff;line-height:1.55}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}h1,h2,h3{line-height:1.2}
.wrap{max-width:1180px;margin:auto;padding:0 20px}section{padding:64px 0}.alt{background:var(--l)}
h2.t{font-size:1.9rem;margin-bottom:8px}.sub{color:var(--m);margin-bottom:28px}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 20px;font:600 .95rem inherit;cursor:pointer;background:var(--g);color:#fff;transition:.2s}
.btn:hover{background:var(--gd);transform:translateY(-1px)}.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}.btn.o:hover{background:var(--l)}
.btn.d{background:#b3261e}.btn.s{padding:6px 12px;font-size:.85rem}
header.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--b);z-index:50}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}.brand img{height:46px;border-radius:4px}.brand b{color:var(--g)}
.links{display:flex;gap:24px;align-items:center}.links a{font-weight:500}.links a:hover{color:var(--g)}
.cnt{background:var(--g);color:#fff;border-radius:99px;padding:1px 8px;font-size:.78rem}
.burger{display:none;background:none;border:0;font-size:1.7rem;cursor:pointer}
@media(max-width:780px){.burger{display:block}.links{display:none;position:absolute;top:68px;left:0;right:0;background:#fff;flex-direction:column;padding:18px;border-bottom:1px solid var(--b)}.links.open{display:flex}}
.hero{background:linear-gradient(120deg,#002146,#00428c);color:#fff;padding:96px 0}.hero h1{font-size:clamp(2rem,5vw,3.4rem);max-width:700px}.hero p{max-width:560px;margin:16px 0 28px;opacity:.9}
.hero .btn{background:#fff;color:var(--gd)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{border:1px solid var(--b);border-radius:var(--r);overflow:hidden;background:#fff;transition:.25s;display:flex;flex-direction:column}.card:hover{box-shadow:0 10px 28px rgba(0,0,0,.08);transform:translateY(-3px)}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%}.card .bd{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.card .ac{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.price{font-weight:700;color:var(--g)}.tag{font-size:.75rem;color:var(--m);text-transform:uppercase;letter-spacing:.05em}.muted{color:var(--m)}
.cat{padding:30px 18px;text-align:center;font-weight:600;cursor:pointer;border:1px solid var(--b);border-radius:var(--r);background:#fff}.cat:hover{border-color:var(--g);color:var(--g)}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid #c8d1e0;border-radius:8px;width:100%;background:#fff}input:focus,select:focus,textarea:focus{outline:2px solid #b7cdee;border-color:var(--g)}
.tools input{flex:2;min-width:200px}.tools select{flex:1;min-width:150px}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}.err{color:#b3261e;font-size:.82rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}@media(max-width:780px){.two{grid-template-columns:1fr;gap:20px}}
.gal img.main{border-radius:var(--r);width:100%;aspect-ratio:4/3;object-fit:cover}.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.thumbs img{width:70px;height:56px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}.thumbs img.on{border-color:var(--g)}
.qty{display:inline-flex;align-items:center;border:1px solid #c8d1e0;border-radius:8px}.qty button{background:none;border:0;width:34px;height:36px;font-size:1.1rem;cursor:pointer}.qty span{min-width:32px;text-align:center}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--b);text-align:left;font-size:.92rem;vertical-align:middle}th{color:var(--m);font-weight:600}.tw{overflow-x:auto}
.box{border:1px solid var(--b);border-radius:var(--r);padding:22px;background:#fff}
.notice{background:#fff8e1;border:1px solid #f0d98a;border-radius:8px;padding:12px 14px;font-size:.9rem;margin:14px 0}
.steps{display:flex;gap:4px;margin:20px 0;flex-wrap:wrap}.step{flex:1;min-width:90px;text-align:center;font-size:.74rem;color:var(--m);border-top:4px solid var(--b);padding-top:6px}.step.on{border-color:var(--g);color:var(--g);font-weight:700}
.tl{border-left:3px solid var(--b);margin-left:8px;padding-left:20px}.tl .it{position:relative;margin-bottom:20px}.tl .it:before{content:"";position:absolute;left:-28px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--g)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:#e2ecf9;color:var(--gd);font-size:.8rem;font-weight:600}.badge.w{background:#fff3cd;color:#8a6d00}.badge.x{background:#fde4e2;color:#b3261e}
footer{background:#1f2321;color:#cfd6d0;padding:44px 0 20px}footer .grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}footer h4{color:#fff;margin-bottom:8px}footer a{display:block;opacity:.85}footer small{display:block;margin-top:28px;opacity:.6}
.wa{position:fixed;right:18px;bottom:18px;background:#25d366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:60;border:0;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px}.toast{background:var(--c);color:#fff;padding:10px 18px;border-radius:8px;animation:in .25s}.toast.e{background:#b3261e}.toast.ok{background:var(--gd)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}.fade{animation:in .35s}
/* admin */
.adm{display:flex;min-height:100vh}.side{width:230px;background:#1f2321;color:#cfd6d0;padding:20px 12px;flex-shrink:0}.side h3{color:#fff;padding:0 10px 16px;font-size:1rem}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px;border-radius:8px;cursor:pointer;font:inherit}.side button:hover,.side button.on{background:var(--g);color:#fff}
.main{flex:1;padding:28px;background:var(--l);min-width:0}.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:24px}.stat b{display:block;font-size:1.9rem;color:var(--g)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:80}.modal .box{max-width:720px;width:100%}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.imgs div{position:relative}.imgs img{width:80px;height:64px;object-fit:cover;border-radius:6px}.imgs button{position:absolute;top:-6px;right:-6px;border:0;background:#b3261e;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer}
@media(max-width:780px){.adm{flex-direction:column}.side{width:100%;display:flex;flex-wrap:wrap;gap:4px}.side h3{width:100%}.side button{width:auto}.main{padding:16px}}
.login{max-width:400px;margin:10vh auto;padding:0 16px}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.12),transparent 40%),linear-gradient(120deg,#002146,#00428c)}
.hero:after{content:"";position:absolute;right:-90px;bottom:-90px;width:380px;height:380px;border:60px solid rgba(255,255,255,.07);border-radius:50%}.hero .wrap{position:relative;z-index:1}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #c8d1e0;border-top-color:var(--g);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}@keyframes sp{to{transform:rotate(360deg)}}
section>.wrap{animation:in .5s}.card img{transition:transform .4s}.card:hover img{transform:scale(1.04)}.links a.cur{color:var(--g);font-weight:700}
/* preloader, whatsapp, hero slider, accounts, skeleton */
#pre{position:fixed;inset:0;background:#fff;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s,visibility .4s}#pre.hide{opacity:0;visibility:hidden}
#pre img{height:70px;border-radius:6px;animation:pl 1.4s ease-in-out infinite}.pbar{width:140px;height:4px;background:#e1e8f2;border-radius:4px;overflow:hidden}.pbar:after{content:"";display:block;width:40%;height:100%;background:var(--g);animation:pb 1s ease-in-out infinite}
@keyframes pb{from{margin-left:-40%}to{margin-left:100%}}@keyframes pl{50%{transform:scale(1.05);opacity:.85}}
.wa{position:fixed;right:18px;bottom:18px;width:62px;height:62px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:60;border:0;cursor:pointer;transition:transform .2s}
.wa svg{width:36px;height:36px}.wa:hover{transform:scale(1.08)}.wa:before{content:"";position:absolute;inset:0;border-radius:50%;background:#25d366;opacity:.5;animation:pulse 2s infinite;z-index:-1}@keyframes pulse{to{transform:scale(1.55);opacity:0}}
.wa span{position:absolute;right:72px;background:#fff;color:#2b2d2f;padding:6px 12px;border-radius:8px;font-size:.85rem;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.15);white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}.wa:hover span{opacity:1}
.wab{background:#25d366!important;display:inline-flex;align-items:center;gap:8px}.wab:hover{background:#1ebe5b!important}
.hs{position:relative;overflow:hidden;height:clamp(420px,66vh,580px);color:#fff;background:#00284f}.hs .tr{display:flex;height:100%;transition:transform .8s cubic-bezier(.65,0,.35,1)}
.sl{min-width:100%;position:relative}.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:75% 50%}
.sl:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,24,52,.88),rgba(0,24,52,.45) 55%,rgba(0,24,52,.08))}
.sl .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.sl h1{font-size:clamp(1.9rem,4.6vw,3.3rem);max-width:640px}.sl p{max-width:520px;margin:14px 0 26px;opacity:.92}.sl .btn{background:#fff;color:var(--gd)}.sl .btn:hover{background:var(--l)}
.hs .ar{position:absolute;top:50%;transform:translateY(-50%);z-index:5;background:rgba(255,255,255,.2);border:0;color:#fff;width:42px;height:42px;border-radius:50%;font-size:1.6rem;cursor:pointer}.hs .ar:hover{background:rgba(255,255,255,.4)}.ar.l{left:14px}.ar.r{right:14px}
.dots{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:.3s}.dots i.on{background:#fff;width:28px;border-radius:6px}@media(max-width:600px){.hs .ar{display:none}}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border:0;background:var(--l);border-radius:8px;font:600 .95rem inherit;cursor:pointer}.tabs button.on{background:var(--g);color:#fff}
.sk{height:330px;border-radius:12px;background:linear-gradient(90deg,#eef2f8 25%,#f8fafd 50%,#eef2f8 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.box p a{text-decoration:underline}footer p a{text-decoration:underline}
.sl{background:linear-gradient(120deg,#001f44,#00428c)}.card img{background:#eef3fa}
</style></head>
<body data-page="shop"><div id="pre"><img src="images/logo.png" alt=""><div class="pbar"></div></div><header class="nav" id="nav"></header><main id="app"></main><footer id="foot"></footer><button class="wa" id="wa" aria-label="Chat on WhatsApp"><span>Chat with us</span><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M16.02 3C9.38 3 4 8.38 4 15.02c0 2.12.55 4.19 1.6 6.02L4 29l8.12-1.57a12 12 0 0 0 3.9.65h.01C22.66 28.08 28 22.7 28 16.06 28 9.4 22.67 3 16.02 3zm0 22.1a10 10 0 0 1-5.1-1.4l-.37-.22-3.8.74.78-3.7-.24-.38A10.05 10.05 0 1 1 26.07 15c0 5.5-4.5 10.1-10.05 10.1z"/><path fill="#fff" d="M21.8 18.6c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-1.77-.88-2.93-1.58-4.1-3.58-.3-.53.31-.49.88-1.62.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.5 1.88.82 2.62.88 3.56.74.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/></svg></button>
<script src="site-data.js"></script><script src="js/products.js"></script><script src="js/store.js"></script><script src="js/storefront.js"></script></body></html>
